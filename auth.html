<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Créer un compte ou se connecter à iladitquoi.">
  <title>Connexion · iladitquoi</title>
  <style>
    :root { color-scheme: light; --page: #f6f7fb; --surface: #fff; --line: #dbe1ee; --text: #172033; --muted: #64708a; --blue: #1658f5; --blue-dark: #0f45d5; --error: #b83c2e; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--page); color: var(--text); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    :focus-visible { outline: 3px solid rgba(22, 88, 245, .28); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .auth-header { border-bottom: 1px solid var(--line); background: var(--surface); }
    .auth-header-inner { display: flex; align-items: center; justify-content: space-between; width: min(100% - 32px, 1040px); min-height: 68px; margin: 0 auto; }
    .brand { display: inline-flex; align-items: baseline; gap: 7px; color: var(--text); font-size: 20px; font-weight: 800; text-decoration: none; }
    .brand-mark { color: var(--blue); font-size: 29px; line-height: 0; }
    .back-link { color: var(--blue); font-size: 13px; font-weight: 700; text-decoration: none; }
    .auth-main { display: grid; place-items: start center; padding: 56px 16px 72px; }
    .auth-panel { width: min(100%, 470px); border: 1px solid var(--line); border-radius: 8px; padding: 30px; background: var(--surface); box-shadow: 0 16px 42px rgba(32, 48, 84, .08); }
    .auth-heading { margin-bottom: 24px; }
    .eyebrow { margin: 0 0 7px; color: var(--blue); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-size: 28px; line-height: 1.15; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
    .auth-tab { border: 0; border-bottom: 3px solid transparent; padding: 11px 8px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; }
    .auth-tab[aria-selected="true"] { border-color: var(--blue); color: var(--text); }
    .primary-button, .secondary-button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; border-radius: 6px; padding: 10px 14px; font-weight: 700; text-decoration: none; }
    .auth-form { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; color: var(--text); font-size: 12px; font-weight: 700; }
    .field input, .field select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; background: #fff; color: var(--text); font-size: 14px; }
    .field input:focus, .field select:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(22, 88, 245, .12); }
    .avatar-field { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 7px; padding: 10px; }
    .avatar-preview { display: grid; place-items: center; flex: none; width: 52px; height: 52px; overflow: hidden; border-radius: 50%; background: #172033; color: white; font-size: 17px; font-weight: 800; }
    .avatar-preview.has-image { background-position: center; background-size: cover; color: transparent; }
    .avatar-field-copy { display: grid; min-width: 0; gap: 4px; }
    .avatar-field-copy input { min-height: 0; border: 0; padding: 0; background: transparent; font-size: 11px; }
    .avatar-field-copy small { color: var(--muted); font-size: 10px; line-height: 1.35; }
    .check-field { display: flex; align-items: start; gap: 9px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .check-field input { margin-top: 2px; accent-color: var(--blue); }
    .primary-button { border: 1px solid var(--blue); background: var(--blue); color: #fff; }
    .primary-button:hover { background: var(--blue-dark); }
    .secondary-button { border: 1px solid var(--line); background: #fff; color: var(--text); }
    .text-button { justify-self: start; border: 0; padding: 0; background: transparent; color: var(--blue); font-size: 12px; font-weight: 700; }
    .auth-status { min-height: 21px; margin: 17px 0 0; color: #28734d; font-size: 12px; line-height: 1.45; }
    .auth-status.is-error { color: var(--error); }
    .signed-in-copy { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .signed-in-actions { display: grid; gap: 10px; }
    .confirmation-copy { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    @media (max-width: 520px) {
      .auth-header-inner { min-height: 60px; }
      .brand { font-size: 17px; }
      .auth-main { padding-top: 24px; }
      .auth-panel { padding: 22px 18px; }
      h1 { font-size: 24px; }
    }
  </style>
  <link rel="stylesheet" href="/theme.css">
</head>
<body data-page="auth">
  <header class="auth-header">
    <div class="auth-header-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">&#8220;</span><span>iladitquoi</span></a>
      <a class="back-link" href="/">Retour au fil</a>
    </div>
  </header>
  <main class="auth-main">
    <section class="auth-panel" id="auth-root" aria-labelledby="auth-title">
      <div class="auth-heading"><p class="eyebrow">Votre espace</p><h1 id="auth-title">Retrouvez vos anecdotes</h1></div>
      <div class="auth-tabs" role="tablist" aria-label="Accès au compte" data-auth-entry>
        <button class="auth-tab" type="button" role="tab" aria-selected="true" data-auth-tab="signin">Connexion</button>
        <button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-tab="signup">Créer un compte</button>
      </div>
      <form class="auth-form" id="signin-form" data-auth-view="signin">
        <label class="field">Adresse e-mail<input name="email" type="email" autocomplete="email" required></label>
        <label class="field">Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">Se connecter</button>
        <button class="text-button" id="forgot-password" type="button">Mot de passe oublié</button>
      </form>

      <form class="auth-form" id="signup-form" data-auth-view="signup" hidden>
        <label class="field">Pseudonyme<input name="pseudonym" type="text" minlength="3" maxlength="32" autocomplete="nickname" required></label>
        <label class="field">Métier
          <select name="profession" required><option value="">Chargement…</option></select>
        </label>
        <label class="field">Adresse e-mail<input name="email" type="email" autocomplete="email" required></label>
        <label class="field">Mot de passe<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label class="field">Confirmer le mot de passe<input name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></label>
        <label class="check-field"><input name="rules" type="checkbox" required><span>J’accepte les <a href="/legal.html#cgu" target="_blank" rel="noopener">CGU</a>, la <a href="/legal.html#confidentialite" target="_blank" rel="noopener">politique de confidentialité</a> et je m’engage à ne publier aucune information permettant d’identifier une personne.</span></label>
        <button class="primary-button" type="submit">Créer mon compte</button>
      </form>

      <div data-auth-view="signup-confirmation" hidden>
        <p class="confirmation-copy">Un lien d’activation a été envoyé à <strong data-confirmation-email></strong>. Ouvrez-le avant de vous connecter.</p>
        <div class="signed-in-actions"><button class="primary-button" id="resend-confirmation" type="button">Renvoyer l’e-mail</button><button class="secondary-button" type="button" data-back-to-login>Retour à la connexion</button></div>
      </div>

      <form class="auth-form" id="reset-form" data-auth-view="reset" hidden>
        <label class="field">Adresse e-mail<input name="email" type="email" autocomplete="email" required></label>
        <button class="primary-button" type="submit">Envoyer le lien</button>
        <button class="text-button" type="button" data-back-to-login>Retour à la connexion</button>
      </form>

      <form class="auth-form" id="password-form" data-auth-view="update-password" hidden>
        <label class="field">Nouveau mot de passe<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label class="field">Confirmer le mot de passe<input name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="primary-button" type="submit">Mettre à jour</button>
      </form>

      <form class="auth-form" id="profile-form" data-auth-view="profile" hidden>
        <label class="field">Pseudonyme<input name="pseudonym" type="text" minlength="3" maxlength="32" autocomplete="nickname" required></label>
        <label class="field">Métier
          <select name="profession" required><option value="">Chargement…</option></select>
        </label>
        <label class="field">Photo de profil<div class="avatar-field"><span class="avatar-preview" data-avatar-preview aria-hidden="true">·</span><span class="avatar-field-copy"><input name="avatar" type="file" accept="image/jpeg,image/png,image/gif"><small>JPEG, PNG ou GIF, 4 Mo maximum.</small></span></div></label>
        <button class="primary-button" type="submit">Terminer mon profil</button>
      </form>

      <div data-auth-view="signed-in" hidden>
        <p class="signed-in-copy">Vous êtes connecté avec <strong data-signed-in-email></strong>.</p>
        <div class="signed-in-actions"><a class="primary-button" href="/profile.html">Ouvrir mon profil</a><button class="secondary-button" type="button" data-auth-signout>Se déconnecter</button></div>
      </div>
      <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="/assets/auth.js"></script>
</body>
</html>
